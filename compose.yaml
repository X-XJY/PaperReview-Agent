services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - paper-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    command: ["python", "-m", "backend.worker"]
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - paper-data:/app/data
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
volumes:
  paper-data:
